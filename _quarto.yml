project:
  type: website
  output-dir: _site
  resources:
    - CNAME            # the custom domain, antonyp.com
    - assets/
    - .well-known/     # security.txt
  post-render:
    - node scripts/backlinks.mjs   # "Referenced by" lists

website:
  title: "antony-mathematics"
  description: "Notes and essays on mathematics: number theory, analysis, and whatever I'm proving this week."
  site-url: https://antonyp.com
  favicon: assets/logo.svg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  image: assets/card.png
  back-to-top-navigation: true
  bread-crumbs: false
  page-navigation: false
  search:
    location: navbar
    type: overlay
    keyboard-shortcut: ["/", "s"]
  navbar:
    logo:
      light: assets/logo.svg
      dark: assets/logo.svg
    logo-alt: "antony-mathematics home"
    title: "antony-mathematics"
    pinned: false
    collapse-below: xl     # nine tabs only fit side by side from 1200 px; narrower screens get the ☰ menu
    left:
      - text: Writing
        href: archive.qmd
      - text: Notebook
        href: notebook.qmd
      - text: Problems
        href: problems.qmd
      - text: Lectures
        href: lectures.qmd
      - text: Results
        href: results.qmd
      - text: Topics
        href: topics.qmd
      - text: Theorems
        href: theorems.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/antonyp-wustl
        aria-label: GitHub
      - icon: rss
        href: archive.xml
        aria-label: RSS feed
  page-footer:
    left: "© 2026 Antony"
    center: "Press <kbd>/</kbd> to search · <kbd>t</kbd> to switch theme · <kbd>p</kbd> to fold proofs"
    right:
      - text: RSS
        href: archive.xml
      - text: Built with Quarto
        href: https://quarto.org

filters:
  - theme/am.lua

shortcodes:
  - theme/shortcodes.lua

language:
  title-block-modified: "Revised"

format:
  html:
    theme:
      dark: [darkly, theme/dark.scss, theme/common.scss]
      light: [flatly, theme/light.scss, theme/common.scss]
    highlight-style:
      dark: nord
      light: github
    html-math-method:
      method: katex
      url: /assets/vendor/katex/    # self-hosted KaTeX 0.16.11, no CDN
    lightbox: auto
    smooth-scroll: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    footnotes-hover: true
    crossrefs-hover: true
    code-copy: true
    code-overflow: wrap
    include-in-header:
      - text: |
          <link href="/assets/fonts/fonts.css" rel="stylesheet">
          <link rel="preload" href="/assets/fonts/newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
      - file: theme/katex-macros.html
    include-after-body:
      - file: theme/site.html
      - file: theme/analytics.html
