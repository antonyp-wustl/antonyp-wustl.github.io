# Builds the site and publishes it to GitHub Pages on every push to main,
# and every morning publishes anything scheduled for that day.
# (Settings → Pages → Source must be set to "GitHub Actions".)
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC: early morning in the US

# Nothing by default; each job asks for only what it needs. Actions are pinned to exact
# commits (the comment says which release) so a moved tag can't change what runs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Turn scheduled posts whose date has come into normal posts (scripts/schedule.mjs).
  schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commits newly published posts
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - id: publish
        run: |
          node scripts/schedule.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Publish scheduled posts"
            git push
          fi

  build:
    needs: schedule
    # The morning run only rebuilds when something went live.
    if: github.event_name != 'schedule' || needs.schedule.outputs.published != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          ref: main
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b   # v2
      - name: Render
        run: quarto render          # also adds "Referenced by" lists (post-render in _quarto.yml)
      - name: Draw share images
        run: node scripts/cards.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4: PDFs of unchanged posts
        with:
          path: .pdf-cache
          key: pdfs-${{ github.run_id }}
          restore-keys: pdfs-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4: TeX, installed on the first run (bump v1 to reinstall)
        with:
          path: ~/.TinyTeX
          key: tinytex-v1
      - name: Typeset PDFs
        run: node scripts/pdfs.mjs
        continue-on-error: true     # a LaTeX problem never stops the site going up
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
