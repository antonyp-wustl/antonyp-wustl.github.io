<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30" role="img" aria-label="antony-mathematics">
  <!-- The centre of an Ulam spiral: 1 in the middle, primes 2, 3, 5, 7 filled -->
  <rect width="30" height="30" rx="5" fill="#142449"/>
  <rect x="5" y="5" width="6" height="6" fill="#f2b134"/>   <!-- 5 -->
  <rect x="19" y="5" width="6" height="6" fill="#f2b134"/>  <!-- 3 -->
  <rect x="19" y="12" width="6" height="6" fill="#f2b134"/> <!-- 2 -->
  <rect x="5" y="19" width="6" height="6" fill="#f2b134"/>  <!-- 7 -->
  <circle cx="15" cy="8" r="1.4" fill="#9aa3b8"/>           <!-- 4 -->
  <circle cx="8" cy="15" r="1.4" fill="#9aa3b8"/>           <!-- 6 -->
  <circle cx="15" cy="22" r="1.4" fill="#9aa3b8"/>          <!-- 8 -->
  <circle cx="22" cy="22" r="1.4" fill="#9aa3b8"/>          <!-- 9 -->
  <rect x="13" y="13" width="4" height="4" fill="none" stroke="#e9e4d6" stroke-width="1"/> <!-- 1 -->
</svg>
